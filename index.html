<title>segmind@portfolio: ~</title>
<style>
/* A minimal blue terminal with lightweight controls and motion. */
:root{color-scheme:dark;--bg:#0b1220;--surface:#101b2c;--bar:#17253a;--line:#2b3d55;--blue:#7abaff;--text:#d9e3f0;--muted:#93a6bf;--error:#ff9b9b}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;background:var(--bg);color:var(--text);font:13px/1.8 ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',monospace}
.terminal{width:min(860px,100%);height:min(600px,calc(100dvh - 56px));display:flex;flex-direction:column;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--surface)}
.titlebar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--bar);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);flex-shrink:0}.symbol{color:var(--blue);font-weight:bold}#title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#screen{flex:1;overflow:auto;padding:23px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;overscroll-behavior:contain}
.entry{margin-bottom:18px}.echo{color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}.echo b,.prompt,.accent{color:var(--blue);font-weight:normal}.result{white-space:pre-wrap;overflow-wrap:anywhere}.error{color:var(--error)}.muted{color:var(--muted)}.welcome{font-size:15px;color:var(--text)}
a{color:var(--blue);text-underline-offset:3px}a:hover{color:#c0e1ff}a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
#form{display:flex;align-items:baseline;gap:9px;direction:ltr}.prompt{white-space:nowrap}#input{font:inherit;line-height:inherit;background:transparent;color:var(--text);border:0;outline:none;min-width:0;flex:1;padding:0;caret-color:var(--blue)}#input:focus-visible{outline:0}#form:focus-within .prompt{color:#a7d4ff}
#suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}#suggestions:empty{display:none}#suggestions button{background:var(--bar);border:1px solid var(--line);color:var(--blue);font:inherit;padding:3px 8px;cursor:pointer}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:600px){body{padding:0}.terminal{width:100%;height:100dvh;border:0;border-radius:0}.titlebar{padding:calc(12px + env(safe-area-inset-top)) 16px 12px}#screen{padding:20px 16px calc(20px + env(safe-area-inset-bottom))}#input{font-size:16px}.prompt{font-size:12px}}
/* Small controls and restrained terminal animations. */
.titlebar{padding-block:8px}#title{flex:1}.window-controls{display:flex;gap:4px;margin-inline-start:auto}.icon-button{display:grid;place-items:center;width:34px;height:34px;border:0;border-radius:4px;color:var(--muted);background:transparent;cursor:pointer;transition:background .15s,color .15s}.icon-button:hover{background:#243650;color:var(--blue)}.icon-button.exit:hover{color:var(--error);background:#402b37}.icon-button svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.terminal{animation:terminal-in .28s ease-out}.entry{animation:output-in .16s ease-out}.ascii-logo{font:clamp(5px,1.5vw,9px)/1.35 ui-monospace,Consolas,monospace;white-space:pre;color:var(--blue);margin:0 0 18px;direction:ltr;user-select:none}.terminal-footer{display:flex;justify-content:space-between;gap:12px;flex-shrink:0;border-top:1px solid var(--line);padding:9px 18px;color:var(--muted);font-size:10px}.session-state{display:flex;align-items:center;gap:7px}.session-dot{width:5px;height:5px;border-radius:50%;background:var(--blue)}.is-closed .session-dot{background:var(--muted)}
#closed{padding:16px 0}#closed p{margin:0 0 14px}#reconnect{font:inherit;color:var(--blue);border:1px solid var(--line);border-radius:4px;background:transparent;padding:7px 12px;cursor:pointer}#reconnect:hover{background:var(--bar)}[hidden]{display:none!important}
.terminal:fullscreen,.terminal.expanded{width:100%;height:100dvh;max-width:none;border-radius:0}.terminal.expanded{position:fixed;inset:0;z-index:2}
@keyframes terminal-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes output-in{from{opacity:.45;transform:translateY(2px)}to{opacity:1;transform:none}}
@media(max-width:600px){.titlebar{padding-block:calc(4px + env(safe-area-inset-top)) 4px;gap:9px}.icon-button{width:44px;height:44px}.terminal-footer{padding:9px 16px calc(9px + env(safe-area-inset-bottom));font-size:9px}#screen{padding-bottom:20px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<body>
<main class="terminal" aria-label="Portfolio terminal">
<header class="titlebar"><span class="symbol" aria-hidden="true">&gt;_</span><span id="title">segmind@portfolio: ~</span><div class="window-controls"><button class="icon-button" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Fullscreen" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4"/></svg></button><button class="icon-button exit" id="exit" type="button" aria-label="Exit terminal" title="Exit terminal"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div></header>
<section id="screen" aria-label="Terminal history" tabindex="0">
<div id="output"></div>
<form id="form" autocomplete="off"><label class="prompt" for="input"><span>segmind</span>:<span id="path">~</span> $</label><input id="input" aria-label="Terminal command" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send"></form>
<div id="suggestions" aria-label="Command suggestions"></div>
<div id="closed" hidden><p class="muted">[session closed]</p><button id="reconnect" type="button">Reconnect ↵</button></div>
</section>
<footer class="terminal-footer"><span class="session-state"><i class="session-dot" aria-hidden="true"></i><span id="sessionStatus">Connected</span></span><span>© <span id="year">2026</span> SegMind25 · MIT</span></footer>
</main>
<div id="announce" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
<noscript>Please enable JavaScript or visit <a href="https://github.com/SegMind25">SegMind25 on GitHub</a>.</noscript>
<script>
'use strict';
// Original portfolio data and virtual files.
const SEED = {
  '/home/segmind': {
    type: 'd',
    children: {
      'README.md': {
        type: 'f',
        content: `# SegMind25\nLinux enthusiast, content creator, developer.\n\nQuick Links:\n  gaming   →  youtube.com/@SegMind25\n  coding   →  youtube.com/@SegError\n  tiktok   →  tiktok.com/@segmind25\n  discord  →  discord.gg/WeUYH3x9Cr\n  github   →  github.com/SegMind25\n\nType 'help' for all commands.`
      },
      'about.txt': {
        type: 'f',
        content: `SegMind25 — Linux Enthusiast & Content Architect\n\nI create content around gaming, coding, and technology.\nMy goal is to help others learn and grow in the digital space.\n\nStatus:   Always Learning\nLocation: The Internet`
      },
      'skills.txt': {
        type: 'f',
        content: `Development   Linux · HTML/CSS/JS · Git\nContent       YouTube · TikTok · OBS Studio\nCommunity     Discord Management · Streaming\nOther         Problem Solving · Video Editing`
      },
      'contact.txt': {
        type: 'f',
        content: `Gaming   youtube.com/@SegMind25\nCoding   youtube.com/@SegError\nTikTok   tiktok.com/@segmind25\nDiscord  discord.gg/WeUYH3x9Cr\nGitHub   github.com/SegMind25`
      },
      'gaming.link':  { type:'link', url:'https://www.youtube.com/@SegMind25',     content:'🎮 YouTube Gaming — youtube.com/@SegMind25' },
      'coding.link':  { type:'link', url:'https://www.youtube.com/@SegError',      content:'💻 YouTube Coding — youtube.com/@SegError' },
      'tiktok.link':  { type:'link', url:'https://www.tiktok.com/@segmind25',      content:'📱 TikTok — tiktok.com/@segmind25' },
      'discord.link': { type:'link', url:'https://discord.gg/WeUYH3x9Cr',          content:'💬 Discord — discord.gg/WeUYH3x9Cr' },
      'github.link':  { type:'link', url:'https://github.com/SegMind25',            content:'🐙 GitHub — github.com/SegMind25' },
      'projects': {
        type: 'd',
        children: {
          'README.md': {
            type: 'f',
            content: `Projects — github.com/SegMind25\n\n• Terminal Portfolio   This interactive terminal\n• Tutorial Series      Educational content\n• Community Tools      Discord bots & utilities`
          }
        }
      }
    }
  }
};

const links={gaming:'https://www.youtube.com/@SegMind25',coding:'https://www.youtube.com/@SegError',tiktok:'https://www.tiktok.com/@segmind25',discord:'https://discord.gg/WeUYH3x9Cr',github:'https://github.com/SegMind25'};
const root='/home/segmind', $=s=>document.querySelector(s), input=$('#input'), output=$('#output'), screen=$('#screen');
let fs=structuredClone(SEED), cwd=root, history=[], position=0, draft='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=s=>esc(s), error=s=>`<span class="error">${esc(s)}</span>`;
const link=(url,label)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`;
const shortPath=()=>cwd===root?'~':'~'+cwd.slice(root.length);
function updatePath(){$('#path').textContent=shortPath();$('#title').textContent='segmind@portfolio: '+shortPath();document.title=$('#title').textContent}
function scroll(){screen.scrollTop=screen.scrollHeight}
function print(html,command){
 const entry=document.createElement('div');entry.className='entry';
 if(command!==undefined){const echo=document.createElement('div');echo.className='echo';echo.innerHTML=`<b>${esc(shortPath())} $</b> ${esc(command)}`;entry.append(echo)}
 const result=document.createElement('div');result.className='result';result.innerHTML=html;entry.append(result);output.append(entry);
 while(output.children.length>150)output.firstElementChild.remove();
 $('#announce').textContent=result.textContent;scroll();
}
const asciiLogo=" ███████╗███████╗ ██████╗ ███╗   ███╗██╗███╗   ██╗██████╗ ██████╗ ███████╗\n ██╔════╝██╔════╝██╔════╝ ████╗ ████║██║████╗  ██║██╔══██╗╚════██╗██╔════╝\n ███████╗█████╗  ██║  ███╗██╔████╔██║██║██╔██╗ ██║██║  ██║ █████╔╝███████╗\n ╚════██║██╔══╝  ██║   ██║██║╚██╔╝██║██║██║╚██╗██║██║  ██║██╔═══╝ ╚════██║\n ███████║███████╗╚██████╔╝██║ ╚═╝ ██║██║██║ ╚████║██████╔╝███████╗███████║\n ╚══════╝╚══════╝ ╚═════╝ ╚═╝     ╚═╝╚═╝╚═╝  ╚═══╝╚═════╝ ╚══════╝╚══════╝";
function welcome(){print('<pre class="ascii-logo" aria-hidden="true">'+esc(asciiLogo)+'</pre><span class="welcome">SegMind25</span>\n<span class="muted">Linux enthusiast. Content creator. Developer.</span>\n\nType <span class="accent">help</span> to see commands.');}

// This filesystem lives only in memory, never on the visitor's device.
function resolve(path='~'){
 if(path==='~')return root;if(path.startsWith('~/'))path=root+path.slice(1);if(!path.startsWith('/'))path=cwd+'/'+path;
 const parts=[];for(const part of path.split('/')){if(!part||part==='.')continue;if(part==='..')parts.pop();else parts.push(part)}
 const full='/'+parts.join('/');return full===root||full.startsWith(root+'/')?full:null;
}
function nodeAt(path){
 if(!path)return null;let node=fs[root];for(const part of path.slice(root.length).split('/').filter(Boolean)){if(node.type!=='d'||!Object.hasOwn(node.children,part))return null;node=node.children[part]}return node;
}
function parse(value){
 let words=[],word='',quote=null,escape=false,started=false;
 for(const ch of value){if(escape){word+=ch;escape=false;started=true;continue}if(ch==='\\'&&quote!=="'"){escape=true;continue}if(quote){if(ch===quote)quote=null;else word+=ch;continue}if(ch==='"'||ch==="'"){quote=ch;started=true;continue}if(/\s/.test(ch)){if(started){words.push(word);word='';started=false}}else{word+=ch;started=true}}
 if(quote||escape)throw Error('Close the quote or complete the escaped character.');if(started)words.push(word);return words;
}
function mutate(kind,args){
 const name=args.find(a=>!a.startsWith('-'));if(!name)return error('Usage: '+kind+' [path]');
 const path=resolve(name);if(!path||path===root)return error('The virtual root is protected.');
 const parent=nodeAt(path.slice(0,path.lastIndexOf('/'))),base=path.split('/').pop();if(!parent||parent.type!=='d')return error('Parent directory not found.');
 if(kind==='rm'){
  if(!Object.hasOwn(parent.children,base))return error('Path not found: '+name);
  const node=parent.children[base];if(node.type==='d'&&Object.keys(node.children).length&&!args.includes('-r'))return error('Directory is not empty. Use rm -r [path].');
  delete parent.children[base];if(cwd===path||cwd.startsWith(path+'/')){cwd=root;updatePath()}return '';
 }
 if(Object.hasOwn(parent.children,base))return kind==='touch'?'':error('Already exists: '+name);
 Object.defineProperty(parent.children,base,{value:kind==='mkdir'?{type:'d',children:{}}:{type:'f',content:''},writable:true,enumerable:true,configurable:true});return '';
}
// Plain text commands, with links where useful.
const commands={
 help:()=>text('PORTFOLIO\n  about       About me\n  skills      My toolkit\n  projects    My work\n  contact     Social links\n\nTERMINAL\n  ls [-la]    List files\n  cd [path]   Change directory\n  pwd         Current directory\n  tree        Show file tree\n  cat [file]  Read a file\n  touch / mkdir / rm [-r] [path]\n  echo [text] / date / whoami / neofetch\n  history / clear / home / exit\n  resetfs confirm  Restore virtual files\n\nLINKS\n  gaming / coding / youtube / tiktok / discord / github\n  socials     Alias for contact\n\nTab: complete · ↑↓: history · Ctrl+L: clear · Ctrl+C: cancel'),
 about:()=>text(fs[root].children['about.txt']?.content||SEED[root].children['about.txt'].content),
 skills:()=>text(SEED[root].children['skills.txt'].content),
 projects:()=>text('Terminal Portfolio — This interactive terminal\nTutorial Series    — Educational content\nCommunity Tools    — Discord bots & utilities\n\n')+link(links.github,'github.com/SegMind25'),
 contact:()=>Object.entries(links).map(([name,url])=>esc(name.padEnd(10))+link(url,url.replace('https://',''))).join('\n'),
 ls:args=>{
  const path=resolve(args.find(a=>!a.startsWith('-'))||'.'),node=nodeAt(path);if(!node)return error('Path not found.');if(node.type!=='d')return text(path.split('/').pop());
  const flags=args.filter(a=>a.startsWith('-')).join('');return Object.entries(node.children).filter(([name])=>flags.includes('a')||!name.startsWith('.')).map(([name,n])=>(flags.includes('l')?esc(n.type==='d'?'drwxr-xr-x  ':'-rw-r--r--  '):'')+(n.type==='d'?`<span class="accent">${esc(name)}/</span>`:esc(name))).join('\n');
 },
 cd:args=>{const path=resolve(args[0]),node=nodeAt(path);if(!node)return error('Path not found.');if(node.type!=='d')return error('Not a directory.');cwd=path;updatePath();return ''},
 pwd:()=>text(cwd),
 cat:args=>{if(!args[0])return error('Usage: cat [file]');if(args[0]==='resume')return text('No downloadable resume is available.\n\n')+commands.about();const node=nodeAt(resolve(args[0]));if(!node)return error('File not found.');if(node.type==='d')return error('This is a directory.');return node.type==='link'?link(node.url,node.content):text(node.content)},
 tree:()=>{const rows=[shortPath()];function walk(node,prefix){const entries=Object.entries(node.children||{});entries.forEach(([name,n],i)=>{const last=i===entries.length-1;rows.push(prefix+(last?'└── ':'├── ')+name+(n.type==='d'?'/':''));if(n.type==='d')walk(n,prefix+(last?'    ':'│   '))})}walk(nodeAt(cwd),'');return text(rows.join('\n'))},
 touch:args=>mutate('touch',args),mkdir:args=>mutate('mkdir',args),rm:args=>mutate('rm',args),
 echo:args=>text(args.join(' ')),date:()=>text(new Date().toLocaleString()),whoami:()=>text('segmind — Linux Enthusiast & Content Architect'),
 neofetch:()=>text('segmind@portfolio\nOS:    SegMindOS (Web Terminal)\nShell: portfolio\nTheme: blue\nHost:  Browser simulation'),
 history:()=>text(history.map((h,i)=>`${String(i+1).padStart(2)}  ${h}`).join('\n')),
 clear:()=>{output.replaceChildren();return null},
 home:()=>{output.replaceChildren();welcome();return null},
 exit:()=>{closeSession();return null},
 resetfs:args=>{if(args[0]!=='confirm')return text('Run resetfs confirm to restore the virtual files.');fs=structuredClone(SEED);cwd=root;updatePath();return text('Virtual files restored.')},
 youtube:()=>link(links.gaming,'Gaming — @SegMind25')+'\n'+link(links.coding,'Coding — @SegError')
};
commands.socials=commands.contact;for(const [name,url]of Object.entries(links))commands[name]=()=>link(url,url);
function execute(value){
 if($('#closed').hidden===false||!value.trim())return;const before=shortPath();history.push(value);history=history.slice(-50);position=history.length;draft='';input.value='';$('#suggestions').replaceChildren();
 let result;try{const [name,...args]=parse(value.trim());result=Object.hasOwn(commands,name.toLowerCase())?commands[name.toLowerCase()](args):error('Command not found: '+name+'. Type help.')}catch(e){result=error(e.message)}
 if(result!==null){print(result,value);const echo=output.lastElementChild?.querySelector('.echo b');if(echo)echo.textContent=before+' $'}scroll();
}
$('#form').addEventListener('submit',event=>{event.preventDefault();execute(input.value)});
input.addEventListener('input',()=>$('#suggestions').replaceChildren());
input.addEventListener('keydown',event=>{
 if(event.key==='ArrowUp'||event.key==='ArrowDown'){event.preventDefault();if(position===history.length)draft=input.value;position=Math.max(0,Math.min(history.length,position+(event.key==='ArrowUp'?-1:1)));input.value=position===history.length?draft:history[position];input.setSelectionRange(input.value.length,input.value.length)}
 if(event.key==='Tab'&&!event.shiftKey){
  const parts=input.value.split(/\s+/),partial=parts.at(-1),slash=partial.lastIndexOf('/'),prefix=partial.slice(0,slash+1),base=partial.slice(slash+1);
  const matches=parts.length===1?Object.keys(commands).filter(n=>n.startsWith(partial)):Object.entries(nodeAt(resolve(prefix||'.'))?.children||{}).filter(([n])=>n.startsWith(base)).map(([n,v])=>prefix+n+(v.type==='d'?'/':''));
  if(matches.length){event.preventDefault();const lead=input.value.slice(0,input.value.length-partial.length);if(matches.length===1)input.value=lead+matches[0];else{$('#suggestions').replaceChildren();for(const match of matches){const b=document.createElement('button');b.type='button';b.textContent=match;b.onclick=()=>{input.value=lead+match;$('#suggestions').replaceChildren();input.focus()};$('#suggestions').append(b)}$('#suggestions button').focus()}scroll()}
 }
 if(event.ctrlKey&&event.key.toLowerCase()==='l'){event.preventDefault();output.replaceChildren()}
 if(event.ctrlKey&&event.key.toLowerCase()==='c'){event.preventDefault();print('',input.value+'^C');input.value='';$('#suggestions').replaceChildren()}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){$('#suggestions').replaceChildren();if($('.terminal').classList.contains('expanded')){$('.terminal').classList.remove('expanded');syncFullscreen()}if($('#closed').hidden)input.focus()}});
screen.addEventListener('click',event=>{if(event.target===screen&&$('#closed').hidden&&!getSelection().toString())input.focus()});
// Exit closes this simulated session; reconnect restores the prompt.
function closeSession(){
 $('#suggestions').replaceChildren();input.value='';$('#form').hidden=true;$('#closed').hidden=false;
 $('.terminal').classList.add('is-closed');$('#sessionStatus').textContent='Disconnected';
 $('#announce').textContent='Session closed. Select Reconnect to continue.';$('#reconnect').focus();scroll();
}
function reconnect(){
 output.replaceChildren();cwd=root;updatePath();$('#form').hidden=false;$('#closed').hidden=true;
 $('.terminal').classList.remove('is-closed');$('#sessionStatus').textContent='Connected';welcome();input.focus();
}
function syncFullscreen(){
 const active=!!document.fullscreenElement||$('.terminal').classList.contains('expanded');
 $('#fullscreen').setAttribute('aria-pressed',String(active));$('#fullscreen').setAttribute('aria-label',active?'Exit fullscreen':'Enter fullscreen');
 $('#fullscreen').title=active?'Exit fullscreen':'Fullscreen';
 $('#fullscreen path').setAttribute('d',active?'M3 7h4V3m6 0v4h4M7 17v-4H3m10 4v-4h4':'M7 3H3v4m10-4h4v4M3 13v4h4m10-4v4h-4');
}
$('#fullscreen').onclick=async()=>{
 const terminal=$('.terminal');
 try{if(document.fullscreenElement)await document.exitFullscreen();else if(terminal.classList.contains('expanded'))terminal.classList.remove('expanded');else if(document.fullscreenEnabled&&terminal.requestFullscreen)await terminal.requestFullscreen();else terminal.classList.add('expanded')}
 catch{terminal.classList.toggle('expanded')}syncFullscreen();
};
document.addEventListener('fullscreenchange',syncFullscreen);
$('#exit').onclick=closeSession;$('#reconnect').onclick=reconnect;$('#year').textContent=new Date().getFullYear();
welcome();if(matchMedia('(pointer:fine)').matches)input.focus({preventScroll:true});
</script>
</body>
