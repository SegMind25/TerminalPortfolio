<!doctype html>
<html lang="en" data-theme="matrix">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="SegMind25 — Linux enthusiast, content creator and developer. Explore an interactive terminal portfolio.">
<meta name="theme-color" content="#080c09"><title>segmind@portfolio: ~</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Rajdhani:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Arabic:wght@400;700&display=swap">
<style>
@layer reset, themes, layout, components, effects, responsive;
@layer reset {
*{box-sizing:border-box}
body,h1,h2,h3,p,pre{margin:0}
button,input,select{font:inherit}
button,a,select{-webkit-tap-highlight-color:transparent}
button,select{cursor:pointer}
button{color:inherit}
a{color:var(--accent);text-underline-offset:4px}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
button:disabled{cursor:default;opacity:.45}
[hidden]{display:none!important}
::selection{background:var(--accent);color:var(--bg)}
}
@layer themes {
:root{color-scheme:dark;--bg:#080c09;--pane:#0b100def;--panel:#111a14;--accent:#00ff41;--second:#b7f7c7;--text:#e0ede3;--muted:#91a697;--line:#263c2c;--glow:#00ff4116;--font:'JetBrains Mono',monospace;--scan:.12}
[data-theme=matrix]{--font:'Courier New',monospace;--scan:.19}
[data-theme=cyberpunk]{--bg:#0d0d1a;--pane:#101023ee;--panel:#19182f;--accent:#ff2079;--second:#00ffff;--text:#eee8ff;--muted:#b2a6c7;--line:#463053;--glow:#ff207921;--font:'Rajdhani',sans-serif;--scan:.08}
[data-theme=vaporwave]{--bg:#1a0533;--pane:#200b38ee;--panel:#311349;--accent:#ff71ce;--second:#05ffa1;--text:#f9e9ff;--muted:#cfabd9;--line:#643575;--glow:#b967ff22;--scan:.08}
[data-theme=monochrome]{color-scheme:light;--bg:#f5f5f5;--pane:#fffffff2;--panel:#ededed;--accent:#111;--second:#444;--text:#111;--muted:#626262;--line:#d4d4d4;--glow:#00000007;--font:'iA Writer Quattro','JetBrains Mono',monospace;--scan:0}
[data-theme=solarized]{--bg:#002b36;--pane:#002b36f2;--panel:#073642;--accent:#b58900;--second:#2aa198;--text:#93a1a1;--muted:#839496;--line:#586e75;--glow:#268bd218;--scan:.05}
html[lang=ja]{--font:'Noto Sans JP',monospace}
html[lang=zh]{--font:'Noto Sans SC',monospace}
html[lang=ar]{--font:'Noto Sans Arabic',monospace}
}
@layer layout {
body{min-height:100svh;background:var(--bg);color:var(--text);font:13px/1.7 var(--font);padding:34px 28px 22px;overflow-x:hidden;transition:background .3s,color .3s}
#particles,#rain,#confetti,.ambient,.scanlines,#flash{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#particles{z-index:-2;opacity:.6}
.ambient{z-index:-1;background:radial-gradient(ellipse at 50% 0,var(--glow),transparent 65%)}
.page-top,.page-foot{max-width:860px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.page-top{margin-bottom:23px;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:10px;color:var(--text)}
.brand-icon{background:var(--accent);color:var(--bg);padding:0 6px;font-weight:800;font-size:15px}
.online{color:var(--muted);display:flex;align-items:center;gap:9px}
.dot{width:6px;height:6px;display:inline-block;background:var(--accent);box-shadow:0 0 9px var(--glow);border-radius:50%}
.terminal{container-type:inline-size;max-width:860px;margin:auto;height:min(790px,calc(100dvh - 136px));min-height:490px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--pane);box-shadow:0 30px 100px #0004,inset 0 1px 0 #ffffff06;backdrop-filter:blur(20px);overflow:hidden;position:relative;animation:borderPulse 7s infinite}
.titlebar{height:49px;flex-shrink:0;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);padding:0 18px;background:var(--panel)}
.traffic{display:flex;gap:8px;direction:ltr}
.traffic button{height:12px;width:12px;border:0;border-radius:50%;padding:0;background:#ff6057}
.traffic button:nth-child(2){background:#febc2e}
.traffic button:nth-child(3){background:#28c840}
.traffic button:before{content:'';position:absolute;inset:-6px}
.traffic button{position:relative}
#barTitle{font-size:11px;color:var(--muted);direction:ltr;flex:1}
.bar-actions{display:flex;align-items:center;gap:12px}
.icon-btn{border:0;background:transparent;font-size:13px;padding:5px;min-height:32px}
select{border:0;background:transparent;color:var(--muted);max-width:85px;font-size:10px;padding:6px}
select option{background:var(--bg);color:var(--text)}
.toolbar{display:flex;gap:24px;padding:0 25px;border-bottom:1px solid var(--line);flex-shrink:0;overflow:auto;scrollbar-width:none}
.toolbar button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:12px 0;font-size:11px;white-space:nowrap}
.toolbar button:hover,.toolbar button.active{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar span{font-size:9px;opacity:.55;margin-inline-end:5px}
#viewport{overflow:auto;overscroll-behavior:contain;flex:1;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:var(--line) transparent;padding:28px 30px 20px}
#output{min-height:100%}
.entry{margin-bottom:25px}
.echo{direction:ltr;text-align:left;overflow-wrap:anywhere;color:var(--muted);font-size:11px;margin:0 0 12px}
.echo b{color:var(--accent);font-weight:400}
.echo .command{color:var(--text)}
.response{white-space:pre-wrap;overflow-wrap:anywhere}
.response.rich{white-space:normal}
.entry.past{opacity:.6;transition:opacity .3s}
.entry:hover{opacity:1}
.input-wrap{border-top:1px solid var(--line);padding:17px 24px;background:var(--panel);position:relative;flex-shrink:0}
.input-row{display:flex;align-items:center;gap:10px;direction:ltr}
.prompt{color:var(--accent);white-space:nowrap;font-size:12px}
.prompt em{color:var(--muted);font-style:normal}
.input-box{position:relative;flex:1;min-width:0;display:flex;align-items:center}
#command{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:0;font-size:14px;caret-color:var(--accent);line-height:24px}
#command::placeholder{color:var(--muted);opacity:.6}
.block-cursor{width:8px;height:16px;background:var(--accent);position:absolute;left:0;pointer-events:none;animation:blink 1.1s steps(1) infinite}
#command:not(:placeholder-shown)+.block-cursor{display:none}
.input-box:focus-within .block-cursor{opacity:.8}
#command:placeholder-shown{padding-left:13px}
.send{background:none;border:0;color:var(--muted);font-size:18px;padding:0 6px}
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 20px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.7px;color:var(--muted);flex-shrink:0}
.statusbar .dot{width:4px;height:4px;margin-inline-end:5px}
.statusbar span:last-child{direction:ltr}
.page-foot{font-size:9px;color:var(--muted);margin-top:18px;letter-spacing:1px}
.page-foot a{text-decoration:none;color:var(--muted)}
}
@layer components {
.kicker{font-size:10px;letter-spacing:2px;color:var(--accent);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:24px}
.hero{display:grid;grid-template-columns:1fr 175px;gap:12px;align-items:center;padding-bottom:24px}
.hero h1{font:800 clamp(34px,7cqw,64px)/1.05 'JetBrains Mono',monospace;letter-spacing:-5px;color:var(--text);margin-bottom:12px}
.hero h1 .outline{color:transparent;-webkit-text-stroke:1px var(--accent)}
.hero-sub{font-size:12px;color:var(--second);margin-bottom:12px;max-width:470px}
.hero p{max-width:450px;color:var(--muted);font-size:12px;line-height:1.9}
.orb{width:100%;height:170px;overflow:visible;color:var(--accent);filter:drop-shadow(0 0 16px var(--glow))}
.orb .orbit{transform-origin:center;animation:orbit 25s linear infinite}
.orb text{font:9px monospace;fill:var(--muted)}
.divider{height:1px;background:var(--line);margin:5px 0 22px}
.section-label{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:13px}
.quick-grid,.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.quick-card,.project{border:1px solid var(--line);background:linear-gradient(145deg,var(--panel),transparent);border-radius:4px;padding:17px;text-align:start;transition:border-color .2s,background .2s;position:relative}
.quick-card:hover,.project:hover{border-color:var(--accent);background:var(--glow)}
.quick-card .card-num{color:var(--muted);font-size:9px;display:block;margin-bottom:20px}
.quick-card strong{color:var(--text);font-size:12px;font-weight:500;display:block}
.quick-card .arrow{position:absolute;top:13px;inset-inline-end:15px;color:var(--accent)}
.quick-card small{font-size:10px;color:var(--muted);display:block;margin-top:7px}
.hint{font-size:10px;color:var(--muted);margin-top:24px}
.hint code{color:var(--accent);background:var(--glow);padding:3px 5px;border:1px solid var(--line)}
.text-accent{color:var(--accent)}
.text-muted{color:var(--muted)}
.help-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px}
.help-item{display:flex;flex-direction:column;border-bottom:1px solid var(--line);padding:8px 0}
.help-item button{border:0;background:none;color:var(--accent);padding:0;text-align:start;align-self:start}
.help-item small{color:var(--muted);font-size:10px}
.output-title{font-size:18px;font-weight:500;margin-bottom:15px;color:var(--text)}
.ascii{font:11px/1.25 monospace;direction:ltr;text-align:left;color:var(--accent);overflow:auto}
.about-layout{display:grid;grid-template-columns:140px 1fr;gap:24px}
.bio{color:var(--muted);line-height:1.9}
.bio strong{color:var(--text)}
.skill{padding:10px 0;border-bottom:1px solid var(--line)}
.skill-head{display:flex;justify-content:space-between;font-size:11px;gap:10px}
.skill-chars{font:16px/1.8 monospace;letter-spacing:2px;color:var(--accent);display:block;overflow:hidden;white-space:nowrap}
.skill small{color:var(--muted)}
.project{padding:0;overflow:hidden;color:var(--text);transform-style:preserve-3d;cursor:pointer}
.project-art{height:115px;display:flex;align-items:center;justify-content:center;color:var(--accent);background:repeating-linear-gradient(0deg,transparent 0 16px,var(--glow) 17px),repeating-linear-gradient(90deg,transparent 0 16px,var(--glow) 17px);font:35px monospace;border-bottom:1px solid var(--line);position:relative}
.project-art canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.project-art span{z-index:1}
.project-copy{padding:15px}
.project h3{font-size:12px;margin-bottom:7px}
.project p{font-size:10px;color:var(--muted)}
.project small{font-size:8px;letter-spacing:1px;color:var(--accent);display:block;margin-top:17px}
.contact-list{display:grid;gap:9px}
.contact-list a{display:flex;justify-content:space-between;gap:10px;padding:12px;border:1px solid var(--line);text-decoration:none;font-size:11px}
.contact-list a:hover{background:var(--glow)}
.contact-list span{color:var(--muted)}
.palette{display:flex;gap:5px;margin-top:12px}
.palette i{width:24px;height:12px}
.suggestions{position:absolute;bottom:100%;left:15px;right:15px;border:1px solid var(--line);background:var(--panel);padding:10px;display:flex;gap:8px;flex-wrap:wrap}
.suggestions button{background:var(--bg);border:1px solid var(--line);padding:5px 10px}
.floating{position:absolute;bottom:115px;right:20px;z-index:4;background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--accent);padding:7px 12px;font-size:10px}
#skipTyping{bottom:150px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
dialog{background:var(--pane);color:var(--text);border:1px solid var(--accent);border-radius:8px;padding:35px;width:min(760px,92vw);max-height:90dvh;box-shadow:0 0 90px var(--glow);transition:opacity .25s,transform .25s,display .25s allow-discrete;overflow:auto}
dialog::backdrop{background:#000b;backdrop-filter:blur(8px)}
dialog[open]{opacity:1;transform:perspective(1000px) rotateY(0)}
@starting-style{dialog[open]{opacity:0;transform:perspective(1000px) rotateY(-15deg)}
}
.modal-close{float:right;background:none;border:1px solid var(--line);padding:6px 11px}
.modal-art{height:220px;display:grid;place-items:center;color:var(--accent);font:80px monospace;background:var(--glow);margin:25px 0}
.modal-desc{margin:16px 0 24px;color:var(--muted)}
.fold{position:absolute;right:0;top:0;width:90px;height:90px;fill:var(--accent);opacity:.2}
.game{border:1px solid var(--line);padding:18px;background:var(--panel);outline:none}
.game pre{font:clamp(9px,2.8cqw,15px)/1.35 monospace;letter-spacing:2px;color:var(--accent);direction:ltr;text-align:center;white-space:pre}
.game-top{display:flex;justify-content:space-between;margin-bottom:15px;font-size:11px}
.game-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:15px}
.game button{border:1px solid var(--line);background:var(--bg);padding:8px 12px;min-height:44px;min-width:44px}
.game p{font-size:10px;color:var(--muted);margin-top:10px}
.boot{position:fixed;inset:0;background:#050806;color:#00ff41;z-index:20;display:flex;align-items:center;justify-content:center;font:12px/1.8 monospace;padding:30px}
.boot-inner{width:min(560px,100%)}
.boot pre{white-space:pre-wrap}
.boot button{position:absolute;bottom:30px;right:30px;border:1px solid #264830;background:transparent;color:#a2b7a7;padding:10px 15px}
.boot-logo{font-size:clamp(22px,5vw,44px);font-weight:bold;letter-spacing:3px;margin:20px 0}
.boot-cursor{animation:blink 1s steps(1) infinite}
.boot-progress{height:2px;background:#183421;margin-top:25px}
.boot-progress i{height:100%;display:block;background:#00ff41;width:0;transition:width .4s}
}
@layer effects {
.scanlines{z-index:8;opacity:var(--scan);background:repeating-linear-gradient(transparent 0 3px,#000 3px 4px)}
html.houdini .scanlines{background:paint(scanlines)}
#rain{z-index:7}
#confetti{z-index:12}
#flash{z-index:10;opacity:0;background:var(--accent);mix-blend-mode:screen}
.glitch{animation:tear .4s steps(2)}
.shake{animation:shake .25s}
.typing .block-cursor{animation:none}
.vapor-grid{display:none;position:fixed;bottom:-40vh;left:-50%;width:200%;height:80vh;transform:perspective(450px) rotateX(60deg);background:linear-gradient(transparent 96%,#b967ff66 97%),linear-gradient(90deg,transparent 96%,#b967ff66 97%);background-size:70px 70px;z-index:-1;pointer-events:none}
[data-theme=vaporwave] .vapor-grid{display:block}
[data-theme=cyberpunk] .hero h1{text-shadow:3px 0 #ff207966,-3px 0 #00ffff33}
.effects-off .scanlines{display:none}
.effects-off *{animation:none!important;scroll-behavior:auto!important}
@keyframes blink{50%{opacity:0}
}
@keyframes orbit{to{transform:rotate(360deg)}
}
@keyframes borderPulse{50%{box-shadow:0 20px 90px #0004,0 0 25px var(--glow)}
}
@keyframes tear{0%,100%{transform:none;filter:none}
20%{transform:translateX(-3px);clip-path:inset(10% 0 0);filter:drop-shadow(3px 0 #ff2079)}
45%{transform:translateX(3px);clip-path:inset(0 0 15%);filter:drop-shadow(-3px 0 #00ffff)}
70%{transform:translateX(-2px);clip-path:inset(2% 0 0)}
}
@keyframes shake{25%,75%{transform:translateX(-4px)}
50%{transform:translateX(4px)}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
.scanlines{display:none}
}
}
@layer responsive {
@container(max-width:600px){.hero{grid-template-columns:1fr 120px}
.hero h1{letter-spacing:-3px}
.orb{height:130px}
.quick-grid{gap:8px}
.quick-card{padding:12px}
.quick-card small{font-size:9px}
.project-grid{grid-template-columns:1fr}
.project{display:grid;grid-template-columns:110px 1fr}
.project-art{height:100%;border-bottom:0;border-inline-end:1px solid var(--line)}
.about-layout{grid-template-columns:1fr}
.about-layout .ascii{font-size:10px}
.help-grid{grid-template-columns:1fr}
}
@media(max-width:600px){body{padding:0}
.page-top,.page-foot{display:none}
.terminal{height:100dvh;min-height:0;border-radius:0;border:0}
.titlebar{padding:env(safe-area-inset-top) 15px 0;height:calc(50px + env(safe-area-inset-top));gap:13px}
.bar-actions{gap:5px}
#barTitle{font-size:9px}
.toolbar{padding:0 18px;gap:24px}
.toolbar button{min-height:44px}
#viewport{padding:23px 19px}
.input-wrap{padding:15px}
.input-row{gap:7px}
.prompt{font-size:10px}
#command{font-size:16px}
.statusbar{padding-bottom:calc(8px + env(safe-area-inset-bottom));font-size:8px}
.statusbar .keyboard-hint{display:none}
.hero{grid-template-columns:1fr}
.hero h1{font-size:42px}
.hero .orb{display:none}
.hero p{font-size:11px}
.kicker{font-size:9px;margin-bottom:20px}
.quick-card .card-num{margin-bottom:16px}
.quick-card strong{font-size:11px}
.quick-card small{font-size:9px}
.contact-list a{flex-direction:column}
.contact-list span{overflow-wrap:anywhere}
.icon-btn{min-width:32px;min-height:40px}
.hint{line-height:2}
.floating{bottom:115px}
dialog{padding:22px}
.boot{padding:22px}
}
@media(max-width:360px){.prompt em{display:none}
.quick-grid{grid-template-columns:1fr}
.quick-card .card-num{display:none}
.quick-card{padding:10px 15px}
.quick-card small{margin-top:3px}
#barTitle{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.toolbar{gap:18px}
}
}
</style>
</head>
<body>
<canvas id="particles" aria-hidden="true"></canvas><div class="ambient" aria-hidden="true"></div><div class="vapor-grid" aria-hidden="true"></div><div class="scanlines" aria-hidden="true"></div><canvas id="rain" hidden aria-hidden="true"></canvas><canvas id="confetti" hidden aria-hidden="true"></canvas><div id="flash" aria-hidden="true"></div>
<header class="page-top"><div class="brand"><span class="brand-icon">&gt;_</span><span>SEGMIND25 / <span data-i="personal">PERSONAL SYSTEM</span></span></div><span class="online"><i class="dot"></i><span data-i="online">SYSTEM ONLINE</span></span></header>
<main class="terminal" id="terminal" aria-label="SegMind25 portfolio terminal">
<div class="titlebar"><div class="traffic"><button id="exitButton" aria-label="Restart terminal"></button><button id="effectsButton" aria-label="Toggle visual effects" aria-pressed="true"></button><button id="focusButton" aria-label="Focus terminal input"></button></div><span id="barTitle">segmind@portfolio: ~</span><div class="bar-actions"><select id="language" aria-label="Language"><option value="en">EN</option><option value="fr">FR</option><option value="ar">العربية</option><option value="ja">日本語</option><option value="zh">中文</option><option value="es">ES</option><option value="de">DE</option><option value="pt">PT</option></select><button class="icon-btn" id="themeButton" aria-label="Change theme">◐</button><button class="icon-btn" id="audioButton" aria-label="Enable audio" aria-pressed="false">🔇</button></div></div>
<nav class="toolbar" aria-label="Portfolio commands"><button data-command="about"><span>01</span>about</button><button data-command="projects"><span>02</span>projects</button><button data-command="skills"><span>03</span>skills</button><button data-command="contact"><span>04</span>contact</button><button data-command="help"><span>?</span>help</button></nav>
<section id="viewport" aria-label="Terminal history" tabindex="0"><div id="output"></div></section>
<button id="newOutput" class="floating" hidden data-i="newOutput">↓ New output</button><button id="skipTyping" class="floating" hidden data-i="skip">Skip animation</button>
<form id="form" class="input-wrap" autocomplete="off"><div id="suggestions" class="suggestions" hidden aria-label="Completions"></div><div class="input-row"><label class="prompt" for="command">segmind<em>@portfolio</em> <span id="cwd">~</span> ❯</label><div class="input-box"><input id="command" aria-label="Terminal command" placeholder="type a command…" spellcheck="false" autocapitalize="off" autocorrect="off"><span class="block-cursor" aria-hidden="true"></span></div><button type="submit" class="send" aria-label="Run command">↵</button></div></form>
<footer class="statusbar"><span><i class="dot"></i><span data-i="ready">READY</span> <span id="themeLabel">/ MATRIX</span></span><span class="keyboard-hint">TAB <span data-i="complete">complete</span> · ↑↓ <span data-i="history">history</span> · CTRL+C <span data-i="cancel">cancel</span></span><span id="clock"></span></footer>
</main>
<footer class="page-foot"><span>© <span id="year"></span> SEGMIND25 · MIT</span><span data-i="built">BUILT WITH CURIOSITY. POWERED BY COFFEE.</span><a href="https://github.com/SegMind25" target="_blank" rel="noopener noreferrer">GITHUB ↗</a></footer>
